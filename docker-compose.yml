x-takbuilds: &takbuildinfo
  image: "takserver:5.5-45"
  build:
    context: .
    dockerfile: Dockerfile
    args:
        TAK_RELEASE: ${TAK_RELEASE:-5.5-RELEASE-45}

services:

  takserver_initialization:
    <<: *takbuildinfo
    env_file:
      - 'takserver.env'
    depends_on:
      takdb:
        condition: service_healthy
    networks:
      - taknet
    volumes:
      - takserver_data:/opt/tak/data
    command: /opt/scripts/firstrun.sh

  takserver_config:
    <<: *takbuildinfo
    env_file:
      - 'takserver.env'
    depends_on:
      takserver_initialization:
          condition: service_completed_successfully
    volumes:
      - takserver_data:/opt/tak/data
    networks:
      - taknet
    ports:
      - '8089:8089'
      - '8443:8443'
      - "7777:7777/udp" 
    command: ./opt/scripts/start-tak.sh config
    healthcheck:
      test: 'true'  # FIXME
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s

  takserver_messaging:
    <<: *takbuildinfo
    env_file:
      - 'takserver.env'
    depends_on:
      takdb:
        condition: service_healthy
      takserver_config:
        condition: service_healthy
    volumes:
      - takserver_data:/opt/tak/data
    network_mode: "service:takserver_config"
    command: ./opt/scripts/start-tak.sh messaging
    healthcheck:
      test: 'true'  # FIXME
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s

  takserver_api:
    <<: *takbuildinfo
    env_file:
      - 'takserver.env'
    depends_on:
      takdb:
        condition: service_healthy
      takserver_messaging:
        condition: service_healthy
      takserver_config:
        condition: service_healthy
    volumes:
      - takserver_data:/opt/tak/data
      - ./update:/opt/tak/webcontent/update
    network_mode: "service:takserver_messaging"
    command: ./opt/scripts/start-tak.sh api
    healthcheck:
      test: 'true'  # FIXME
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s

  takserver_retention:
    <<: *takbuildinfo
    env_file:
      - 'takserver.env'
    depends_on:
      takdb:
        condition: service_healthy
      takserver_messaging:
        condition: service_healthy
      takserver_config:
        condition: service_healthy
    volumes:
      - takserver_data:/opt/tak/data
    network_mode: "service:takserver_messaging"
    command: ./opt/scripts/start-tak.sh retention
    healthcheck:
      test: 'true'  # FIXME
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s

  takserver_pluginmanager:
    <<: *takbuildinfo
    env_file:
      - 'takserver.env'
    depends_on:
      takdb:
        condition: service_healthy
      takserver_api:
        condition: service_healthy
      takserver_config:
        condition: service_healthy
    volumes:
      - takserver_data:/opt/tak/data
      - ./update:/opt/tak/webcontent/update 
    network_mode: "service:takserver_messaging"
    command: ./opt/scripts/start-tak.sh pm
    healthcheck:
      test: 'true'  # FIXME
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s

  takdb:
    build:
      context: ./db
      dockerfile: Dockerfile
    # optional: force arm64 explicitly
    # platform: linux/arm64
    networks:
      - taknet
    env_file:
      - 'takserver.env'
    volumes:
      - 'takdb_data:/var/lib/postgresql/data'
      - './db/initdb:/docker-entrypoint-initdb.d:ro'
    healthcheck:
      test: "pg_isready --dbname=$$POSTGRES_DB --username=$$POSTGRES_USER"
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  taknet:

volumes:
  takdb_data:
    driver: local
  takserver_data:
    driver: local
